name: Routines

# Scheduled calls to the API's internal routes (Vercel Hobby has no crons).
# They authenticate with CRON_SECRET; until the API is deployed and the
# secrets API_URL / CRON_SECRET exist, every run is skipped.
#   - briefing: hourly, prepares the morning briefing of every owner whose
#     time is within the next hour (in their own time zone);
#   - news: reads the followed feeds three times a day;
#   - maintenance: deletes system logs, signed-out devices, headlines and
#     briefings past their retention.
on:
  schedule:
    # GitHub may start scheduled runs a few minutes late; that is fine here.
    - cron: "30 6 * * *" # 03:30 in Brasília time
    - cron: "0 9,15,21 * * *" # 06:00, 12:00 and 18:00 in Brasília time
    - cron: "5 * * * *" # hourly, for the morning briefing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routines
  cancel-in-progress: false

jobs:
  run:
    name: internal routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until the API is deployed
        id: ready
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL/CRON_SECRET not set — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the news
        if: steps.ready.outputs.ready == 'true' && (github.event.schedule == '0 9,15,21 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/news/collect"

      - name: Prepare due briefings
        if: steps.ready.outputs.ready == 'true' && (github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/briefing/run"

      - name: Clean up old data
        if: steps.ready.outputs.ready == 'true' && (github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/maintenance/cleanup"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/identity/cleanup"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/news/cleanup"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/briefing/cleanup"
